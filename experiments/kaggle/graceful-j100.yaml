# Optional Nav2 1.3.13 transport candidate. No physics or scoring overrides.
controller_server:
  ros__parameters:
    FollowPath:
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: nav2_graceful_controller::GracefulController
      angular_dist_threshold: 0.3
      angular_disengage_threshold: 0.15
      forward_sampling_distance: 0.02
      use_path_orientations: true
      rotate_to_goal_heading: true
      # Match the original non-stateful outer checker after braking drift.
      # Requires nav2-1.3.13-rotation-position-namespace.patch.
      position_checker:
        stateful: false
      # Requires nav2-1.3.13-rotation-yaw-stop.patch in the selected overlay.
      stop_in_goal_yaw_tolerance: true
      rotate_to_heading_once: false
      closed_loop: true
      rotate_to_heading_angular_vel: 0.055
      max_angular_accel: 2.0
      transform_tolerance: 0.2
      min_lookahead: 0.2
      max_lookahead: 0.4
      k_phi: 2.0
      k_delta: 1.0
      beta: 0.2
      lambda: 2.0
      v_linear_min: 0.0055
      v_linear_max: 0.06
      v_angular_max: 0.055
      v_angular_min_in_place: 0.01
      slowdown_radius: 0.12
      initial_rotation: false
      prefer_final_rotation: true
      # Recheck XY after drift; requires the Graceful path-distance patch.
      stateful: false
      rotation_scaling_factor: 0.5
      allow_backward: true
      in_place_collision_resolution: 0.1
