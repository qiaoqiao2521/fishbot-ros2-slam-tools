; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:fishbot_motion_control_humble]
platform = espressif32@6.8.1
board = featheresp32
framework = arduino
board_microros_transport = custom
board_microros_distro = humble
board_microros_user_meta = microros-colcon.meta
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.partitions = partition.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags = 
	-DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE
	-Iinclude
lib_deps = 
	https://github.com/micro-ROS/micro_ros_platformio.git#cfee17faffaa532363b7151dd13af6a85c69d3c1
	https://github.com/fishros/Esp32McpwmMotor.git#145c06da90599769419abd46d858f17b4f018929
	https://github.com/fishros/Esp32PcntEncoder.git#7cce8d01fa2d343878f3e70c71d95cb51a387316
	adafruit/Adafruit SSD1306@2.5.7
	mathertel/OneButton@2.0.3
	paulstoffregen/Time@1.6.1
	https://github.com/fishros/MPU6050_light.git#d3e10a2545b03cfb874a9faaf4fc125d02d98421
	; marian-craciunescu/ESP32Ping@^1.7


