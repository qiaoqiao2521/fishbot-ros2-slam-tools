name: Continuous twin CPU regression

on:
  pull_request:
    paths:
      - ".github/workflows/continuous-twin-cpu.yml"
      - "tools/cooperation*.py"
      - "tools/tests/test_cooperation*.py"
      - "apps/fishbot-control-station/frontend/**"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/continuous-twin-cpu.yml"
      - "tools/cooperation*.py"
      - "tools/tests/test_cooperation*.py"
      - "apps/fishbot-control-station/frontend/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts-and-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install numeric fixture dependency
        run: python -m pip install numpy==1.26.4
      - name: Check contracts, original receipts, index and replay projection
        run: >-
          python -B -m unittest
          tools.tests.test_cooperation_factory
          tools.tests.test_cooperation_readiness
          tools.tests.test_cooperation_loaded_limits
          tools.tests.test_cooperation_timing
          tools.tests.test_cooperation_comparison
          tools.tests.test_cooperation_grasp_inference
          tools.tests.test_cooperation_workcell_vision.WorkcellConfigurationTests
      - name: Record acceptance boundary
        if: always()
        run: |
          printf '## CPU contracts and index\n\nSource: `%s`\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          These checks use local fixtures. They do not run ROS or MuJoCo.
          They do not prove delivery, snapshot physics, unloading, faults or sim-to-real.
          Raw runs, maps, checkpoints and credentials are not uploaded.
          EOF

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/fishbot-control-station/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Run frontend regression
        run: npm test
      - name: Build production frontend
        run: npm run build
      - name: Record acceptance boundary
        if: always()
        run: |
          printf '## Frontend regression\n\nSource: `%s`\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Unit tests and the build do not replace browser or native navigation acceptance.
          This job does not contact a robot, motion API, or live local workbench.
          EOF
