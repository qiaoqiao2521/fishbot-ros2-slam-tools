controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: [left_wheel_joint]
    right_wheel_names: [right_wheel_joint]
    wheel_separation: 0.20
    # The physical URDF has radius 0.032; its legacy Gazebo plugin rounded diameter to 0.065.
    wheel_radius: 0.032
    odom_frame_id: odom
    base_frame_id: base_footprint
    tf_frame_prefix_enable: false
    enable_odom_tf: true
    position_feedback: true
    open_loop: false
    publish_rate: 30.0
    cmd_vel_timeout: 0.5
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.25
    linear.x.min_velocity: -0.25
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 0.5
    linear.x.max_deceleration: -0.8
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.5
    angular.z.min_velocity: -1.5
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 2.0
    angular.z.max_deceleration: -3.0
