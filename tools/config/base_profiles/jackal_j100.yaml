  files:
    - clearpath_platform_description/urdf/j100/j100.urdf.xacro
    - clearpath_platform_description/urdf/j100/drivetrain/wheels.urdf.xacro
    - clearpath_platform_description/urdf/j100/drivetrain/wheels/outdoor.urdf.xacro
    - clearpath_platform_description/meshes/j100/j100_base.stl
