# Thin robot_localization configuration; the filter is the installed upstream
# implementation. See https://github.com/cra-ros-pkg/robot_localization.
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: false
    publish_tf: true
    print_diagnostics: true
    transform_time_offset: 0.0
    transform_timeout: 0.05
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    odom0: /wheel/odom
    # x,y,z,roll,pitch,yaw,vx,vy,vz,vroll,vpitch,vyaw,ax,ay,az
    odom0_config: [false, false, false, false, false, false,
                   true, true, false, false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
    imu0: /imu_sensor_broadcaster/imu
    imu0_config: [false, false, false, true, true, false,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
