fishbot_light_sim:
  ros__parameters:
    # 雷达参数对齐实机 ydlidar（fishbot_nav/src/ydlidar/params/ydlidar.yaml + 实测）
    scan_rate: 7.0
    samples: 719
    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    range_min: 0.05
    range_max: 64.0
    invalid_range_is_inf: true
    # 坐标系与实机 TF 链一致：map -> odom -> base_footprint -> laser_frame
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    laser_frame: laser_frame
    laser_offset_x: 0.0
    laser_offset_y: 0.0
    # 初始位姿（current_map 中离墙 0.85m 的干净格；原 (-0.07,0.76) 距建图噪点仅
    # 0.18m，会在代价地图里被判起点碰撞）
    initial_x: 0.38
    initial_y: 2.05
    initial_yaw: 0.0
    # 定位：true = 仿真发布 ground-truth map->odom（先调导航逻辑，不调 AMCL）
    # 改为 false 时由 nav2_amcl 提供定位，可验证 AMCL 参数
    ground_truth_localization: true
    # 里程计噪声（模拟打滑/编码器误差；0 = 完美里程计）
    v_noise_std: 0.0
    w_noise_std: 0.0
    # 速度限幅对齐 nav2_params（max_vel_x / max_vel_theta）
    max_v: 0.26
    max_w: 1.0
    # 命令超时刹停（秒），对齐实机安全门思路
    cmd_timeout: 0.5
    # RViz Publish Point 注入的虚拟障碍半径
    obstacle_radius: 0.15
    publish_tf_rate: 50.0
    odom_rate: 30.0
