<!doctype html>
<!-- 移动浏览器回归宿主页：用同源 iframe 加载真实面板页，用于触发真实 visibilitychange（页面 hidden）。
     仅服务器浏览器回归工具，不属于面板功能，不参与面板交互。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panel Regression Host</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      iframe {
        border: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <iframe id="panel" src="/#/home" title="panel"></iframe>
  </body>
</html>
